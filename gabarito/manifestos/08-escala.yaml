apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: emissor
  namespace: notafacil
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: emissor }
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource: { name: cpu, target: { type: Utilization, averageUtilization: 50 } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: portal
  namespace: notafacil
spec:
  minAvailable: 2
  selector: { matchLabels: { app: portal } }
