apiVersion: apps/v1
kind: Deployment
metadata:
  name: emissor
  namespace: notafacil
spec:
  replicas: 2
  selector: { matchLabels: { app: emissor } }
  template:
    metadata: { labels: { app: emissor } }
    spec:
      containers:
      - name: emissor
        image: southamerica-east1-docker.pkg.dev/desafio-nivelamento/notafacil/emissor:1.0
        ports: [{ containerPort: 8000 }]
        envFrom: [{ configMapRef: { name: emissor-config } }]
        env:
        - { name: RESERVA_CACHE_MB, value: "200" }
        resources:
          requests: { cpu: 50m, memory: 64Mi }
          limits: { cpu: 250m, memory: 384Mi }
        readinessProbe: { httpGet: { path: /saude, port: 8000 } }
        livenessProbe: { httpGet: { path: /saude, port: 8000 }, initialDelaySeconds: 10 }
---
apiVersion: v1
kind: Service
metadata:
  name: emissor
  namespace: notafacil
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
spec:
  selector: { app: emissor }
  ports: [{ port: 80, targetPort: 8000 }]
