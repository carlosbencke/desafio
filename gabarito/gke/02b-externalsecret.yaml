apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mongo-cred
  namespace: notafacil
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  target:
    name: mongo-cred
  data:
  - secretKey: MONGO_INITDB_ROOT_USERNAME
    remoteRef: { key: notafacil-mongo-cred, property: username }
  - secretKey: MONGO_INITDB_ROOT_PASSWORD
    remoteRef: { key: notafacil-mongo-cred, property: password }
